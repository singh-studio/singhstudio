[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Unattended gameplay-to-shorts pipeline (ingest, detect, render, schedule, publish)."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6",
  "requests>=2.31",
  "anthropic>=2.6",
  "pydantic>=2.6",
]

[project.optional-dependencies]
youtube = ["google-api-python-client>=2.120", "google-auth-oauthlib>=1.2", "google-auth>=2.28"]
# Apple Silicon (Mac mini M-series): fastest local transcription.
whisper-mlx = ["mlx-whisper>=0.4"]
# Intel Macs / Linux fallback.
whisper = ["faster-whisper>=1.0"]
download = ["yt-dlp>=2024.8.6"]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
