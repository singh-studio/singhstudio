<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laurel editor · Digital honours boards</title>
<meta name="description" content="Make your club or school's digital honours boards: type or paste your names, pick a look, and save one file for your TV, website and touchscreen. Works offline; nothing is uploaded.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f2eb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317140f'/%3E%3Cpath d='M16 6c-4 4-5 9-3 14M16 6c4 4 5 9 3 14M11 12c2 1 4 3 5 6M21 12c-2 1-4 3-5 6M16 20v6' stroke='%23d9b35c' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Laurel editor. Light, calm and large enough for anyone on a committee to use. */
@font-face { font-family: "Switzer"; src: url("../../assets/fonts/switzer-variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  --bg: #f5f2eb; --panel: #ffffff; --ink: #17140f; --ink-2: #3a342b; --mute: #6c655a; --line: #e6dfd2; --line-2: #d3c9b7;
  --gold: #a87b22; --gold-2: #d9b35c; --gold-soft: #f6ecd2; --red: #c2361f; --red-soft: #fbe7e2; --ok: #2c7046; --ok-soft: #e3f1e7;
  --focus: #e23b22; --radius: 12px; --shadow: 0 1px 2px rgba(23, 20, 15, .06), 0 8px 24px rgba(23, 20, 15, .06);
  --font: "Switzer", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --top: 62px; --rail: 214px; --pv: clamp(420px, 40vw, 780px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- frame ---------- */
.ed { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr) var(--pv); grid-template-rows: var(--top) minmax(0, 1fr); height: 100vh; height: 100dvh; }
.ed.no-pv { grid-template-columns: var(--rail) minmax(0, 1fr) 0; }
.ed.is-welcome { grid-template-columns: minmax(0, 1fr); }
.ed.is-welcome .main { grid-column: 1 / -1; }
.ed-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 18px; background: var(--ink); color: #f4efe4; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 640; font-size: 19px; letter-spacing: -0.01em; margin-right: 6px; }
.brand svg { width: 26px; height: 26px; }
.brand small { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: #a9a092; }
.proj { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 340px; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .12); color: #f4efe4; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
.proj span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj:hover { background: rgba(255, 255, 255, .12); }
.status { font-size: 13px; color: #a9a092; white-space: nowrap; }
.status.is-warn { color: #f0b39f; }
.spacer { flex: 1; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; background: transparent; color: #f4efe4; border: 1px solid rgba(255, 255, 255, .16); border-radius: 10px; padding: 8px 12px; cursor: pointer; white-space: nowrap; font-size: 14px; }
.tbtn:hover:not(:disabled) { background: rgba(255, 255, 255, .1); }
.tbtn:disabled { opacity: .35; cursor: default; }
.tbtn svg { width: 16px; height: 16px; }
.chip-lic { border-color: rgba(217, 179, 92, .55); color: #f0d692; }
.chip-lic.is-on { border-color: rgba(120, 200, 150, .5); color: #a8e0bb; }
.tbtn.primary { background: #f4efe4; color: var(--ink); border-color: #f4efe4; font-weight: 600; }
.tbtn.primary:hover { background: #fff; }

.steps { grid-row: 2; border-right: 1px solid var(--line); background: #efebe2; padding: 18px 12px; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
.step { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 10px; padding: 11px 12px; cursor: pointer; color: var(--ink-2); font-size: 15.5px; }
.step i { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 12px/1 var(--mono); font-style: normal; background: #fff; border: 1px solid var(--line-2); color: var(--mute); }
.step:hover { background: rgba(23, 20, 15, .05); }
.step[aria-current="step"] { background: var(--ink); color: #f4efe4; }
.step[aria-current="step"] i { background: var(--gold-2); border-color: var(--gold-2); color: var(--ink); }
.step.is-done i { background: var(--ok-soft); border-color: #b9dcc5; color: var(--ok); }
.steps hr { border: 0; border-top: 1px solid var(--line-2); margin: 14px 6px; width: calc(100% - 12px); }
.side-note { font-size: 13px; color: var(--mute); padding: 4px 12px; line-height: 1.45; }
.side-note a { color: var(--ink-2); }

.main { grid-row: 2; overflow: auto; scroll-behavior: smooth; container-type: inline-size; }
.view { max-width: 820px; margin: 0 auto; padding: 34px 32px 120px; }
.view.wide { max-width: 1180px; }
.vh { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.vh h1 { margin: 0; font-size: 30px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 620; }
.vh p { margin: 6px 0 0; color: var(--mute); max-width: 60ch; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin: 0 0 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
.card + .card { margin-top: 16px; }
.card h2 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; font-weight: 600; }
.card > p { margin: 0 0 16px; color: var(--mute); }

/* ---------- form bits ---------- */
.f { display: block; margin-bottom: 18px; }
.f:last-child { margin-bottom: 0; }
.f > span, .lbl { display: block; font-weight: 600; font-size: 14.5px; margin-bottom: 6px; color: var(--ink-2); }
.f small, .hint { display: block; color: var(--mute); font-size: 13.5px; margin-top: 6px; line-height: 1.45; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.row3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px; }
.in, select.in, textarea.in { width: 100%; background: #fff; border: 1px solid var(--line-2); border-radius: 10px; padding: 11px 12px; font-size: 16px; min-height: 46px; }
.in:hover { border-color: #bfb39d; }
.in:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(23, 20, 15, .1); }
textarea.in { min-height: 120px; resize: vertical; line-height: 1.45; }
.in.big { font-size: 18px; font-weight: 560; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #fff; color: var(--ink); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 16px; min-height: 44px; cursor: pointer; font-weight: 550; text-decoration: none; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover:not(:disabled) { background: #000; }
.btn.gold { background: var(--gold-2); border-color: var(--gold-2); color: var(--ink); }
.btn.danger { color: var(--red); }
.btn.danger:hover { border-color: var(--red); background: var(--red-soft); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: rgba(23, 20, 15, .06); border-color: transparent; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toggle { display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); cursor: pointer; }
.toggle:first-child { border-top: 0; padding-top: 0; }
.toggle input { appearance: none; -webkit-appearance: none; flex: none; width: 46px; height: 28px; border-radius: 999px; background: #d8d0c2; position: relative; cursor: pointer; transition: background .2s; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s; }
.toggle input:checked { background: var(--ok); }
.toggle input:checked::after { transform: translateX(18px); }
.toggle input:disabled { opacity: .45; }
.toggle b { display: block; font-weight: 600; }
.toggle small { display: block; color: var(--mute); font-size: 13.5px; margin-top: 2px; }
.note { border-radius: 10px; padding: 12px 14px; background: var(--gold-soft); color: #5b4513; font-size: 14.5px; line-height: 1.5; }
.note.ok { background: var(--ok-soft); color: #1f4f31; }
.note.warn { background: var(--red-soft); color: #7a2414; }
.note a { color: inherit; font-weight: 600; }
.note + .note { margin-top: 10px; }
.kbd { font: 500 12px/1 var(--mono); padding: 3px 6px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; background: #fff; }

/* crest */
.crest { display: flex; gap: 18px; align-items: center; }
.crest-box { flex: none; width: 112px; height: 112px; border-radius: 14px; border: 1px dashed var(--line-2); background: repeating-conic-gradient(#f3efe6 0% 25%, #fff 0% 50%) 50% / 16px 16px; display: grid; place-items: center; overflow: hidden; }
.crest-box img { max-width: 92%; max-height: 92%; object-fit: contain; }
.crest-box span { font-size: 13px; color: var(--mute); text-align: center; padding: 8px; }

/* ---------- boards ---------- */
.boards { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 20px; align-items: start; }
.blist { position: sticky; top: 0; display: flex; flex-direction: column; gap: 6px; }
.bitem { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 4px 4px 4px 0; }
.bitem > button:first-child { flex: 1; min-width: 0; text-align: left; background: transparent; border: 0; padding: 8px 6px 8px 12px; cursor: pointer; border-radius: 8px; }
.bitem b { display: block; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bitem small { display: block; color: var(--mute); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bitem.is-on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.bitem.is-off b { color: var(--mute); }
.mv { display: flex; flex-direction: column; }
.mv button { background: transparent; border: 0; width: 28px; height: 22px; border-radius: 6px; cursor: pointer; color: var(--mute); display: grid; place-items: center; }
.mv button:hover:not(:disabled) { background: var(--bg); color: var(--ink); }
.mv button:disabled { opacity: .25; cursor: default; }
.mv svg { width: 14px; height: 14px; }
.blist .btn { justify-content: flex-start; }
.group-h { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin: 10px 4px 2px; }

.cols { display: flex; flex-wrap: wrap; gap: 10px; }
.col { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
.col input { width: 150px; border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 9px; background: #fff; }
.col select { border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 6px; background: #fff; }
.col .multi { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink-2); padding: 0 4px; cursor: pointer; }
.col button { background: transparent; border: 0; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; color: var(--mute); }
.col button:hover { background: #fff; color: var(--red); }

.grid-wrap { border: 1px solid var(--line); border-radius: 12px; overflow: auto; background: #fff; max-height: 62vh; }
.grid { width: 100%; border-collapse: separate; border-spacing: 0; }
.grid th { position: sticky; top: 0; z-index: 2; background: #f8f5ef; text-align: left; font: 600 12px/1.2 var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--mute); padding: 10px 8px; border-bottom: 1px solid var(--line); }
.grid th.n, .grid td.n { width: 46px; text-align: right; color: var(--mute); font: 500 12px/1 var(--mono); padding-right: 10px; }
.grid td { border-bottom: 1px solid #f0ebe1; padding: 0; vertical-align: middle; }
.grid tr:last-child td { border-bottom: 0; }
.grid input { width: 100%; border: 0; background: transparent; padding: 11px 8px; font-size: 15.5px; min-width: 70px; }
.grid input:focus { outline: none; background: #fffbea; box-shadow: inset 0 0 0 2px var(--gold-2); }
.grid td.year input { font-variant-numeric: tabular-nums; width: 110px; }
.grid td.name input { font-weight: 560; }
.grid td.acts { width: 84px; white-space: nowrap; text-align: right; padding-right: 6px; }
.grid td.acts button { opacity: .35; background: transparent; border: 0; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; color: var(--ink-2); display: inline-grid; place-items: center; }
.grid tr:hover td.acts button, .grid td.acts button:focus { opacity: 1; }
.grid td.acts button:hover { background: var(--bg); }
.grid td.acts button.has { opacity: 1; color: var(--gold); }
.grid td.acts svg { width: 17px; height: 17px; }
.grid tr.is-void input { color: var(--mute); font-style: italic; }
.grid-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
.empty-grid { padding: 36px 20px; text-align: center; color: var(--mute); }
.empty-grid b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }

/* when the editor column is narrow, the board list folds into a row of chips */
@container (max-width: 980px) {
  .boards { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .blist { position: static; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: thin; }
  .bitem { flex: none; max-width: 240px; }
  .bitem .mv { display: none; }
  .bitem > button:first-child { padding: 8px 12px; }
  .blist .btn { flex: none; }
}

/* paste dialog preview */
.pv-table { max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; margin-top: 12px; }
.pv-table table { width: 100%; border-collapse: collapse; font-size: 14px; }
.pv-table th, .pv-table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #f0ebe1; }
.pv-table th { position: sticky; top: 0; background: #f8f5ef; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); }

/* ---------- look ---------- */
.themes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.theme { position: relative; text-align: left; border: 2px solid var(--line); border-radius: 14px; background: #fff; padding: 0; overflow: hidden; cursor: pointer; }
.theme[aria-checked="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.theme .sw { height: 132px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.theme .sw b { font-size: 21px; letter-spacing: .06em; }
.theme .sw i { font-size: 13px; font-style: normal; letter-spacing: .18em; }
.theme .sw span { font-size: 12px; opacity: .85; }
.theme > div:last-child { padding: 12px 14px 14px; }
.theme strong { display: block; font-size: 15.5px; }
.theme small { display: block; color: var(--mute); font-size: 13px; margin-top: 2px; line-height: 1.4; }
.sw-timber { background-color: #9a4a26; background-blend-mode: multiply; background-size: 300px auto; color: #ecca7c; }
.sw-timber b { font-family: "LR Cinzel", serif; font-weight: 600; background: linear-gradient(180deg, #fff3c9, #ecca7c 30%, #c49444 56%, #e9c579 80%, #f8e5ab); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sw-timber i, .sw-timber span { font-family: "LR Cinzel", serif; }
.sw-heritage { background-color: #efe5cf; background-blend-mode: multiply; background-size: 200px auto; color: #1e2c4a; }
.sw-heritage b { font-family: "LR Garamond", serif; font-style: italic; font-weight: 500; letter-spacing: 0; font-size: 25px; }
.sw-heritage i { color: #8c2f2b; font-family: "LR Garamond", serif; }
.sw-heritage span { font-family: "LR Garamond", serif; font-variant-caps: all-small-caps; letter-spacing: .1em; font-size: 15px; }
.sw-modern { background: #0d1b2a; color: #fff; align-items: flex-start !important; padding-left: 22px; border-left: 8px solid #e0b43a; }
.sw-modern b { font-family: "LR Barlow Condensed", sans-serif; font-weight: 600; font-size: 27px; letter-spacing: .01em; text-transform: uppercase; }
.sw-modern i { color: #e0b43a; font-family: "LR Barlow Condensed", sans-serif; }
.sw-modern span { font-family: "LR Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .04em; font-size: 15px; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 8px 14px 8px 8px; cursor: pointer; }
.swatch[aria-checked="true"] { border-color: var(--ink); }
.swatch i { width: 34px; height: 34px; border-radius: 8px; display: block; border: 1px solid rgba(0, 0, 0, .1); background-size: 120px auto; background-blend-mode: multiply; }
.pairs { display: flex; flex-wrap: wrap; gap: 8px; }
.pair { width: 46px; height: 46px; border-radius: 10px; border: 2px solid var(--line); cursor: pointer; padding: 0; overflow: hidden; display: grid; grid-template-columns: 1fr 12px; }
.pair[aria-checked="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px #fff inset; }
.colors { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.colors label { display: flex; align-items: center; gap: 10px; font-weight: 550; font-size: 14.5px; }
.colors input[type="color"] { width: 46px; height: 40px; border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; background: #fff; cursor: pointer; }

/* ---------- publish ---------- */
.outs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.out { display: flex; flex-direction: column; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
.out svg.ico { width: 40px; height: 40px; color: var(--gold); }
.out h3 { margin: 0; font-size: 17px; }
.out p { margin: 0; color: var(--mute); font-size: 14px; flex: 1; }
.out .btn { width: 100%; }
.out a.more { font-size: 13.5px; color: var(--ink-2); }
.sizes { font: 500 12px/1.4 var(--mono); color: var(--mute); }

/* ---------- preview ---------- */
.pv { grid-row: 2; border-left: 1px solid var(--line); background: #e9e4da; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.ed.no-pv .pv { display: none; }
.pv-bar { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.seg { display: inline-flex; background: #ddd6c8; border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); font-weight: 600; }
.pv-stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 18px; overflow: hidden; position: relative; }
.pv-box { position: relative; box-shadow: 0 20px 50px rgba(23, 20, 15, .25); border-radius: 6px; overflow: hidden; background: #000; }
.pv-box.tv { border: 10px solid #121110; border-radius: 10px; }
.pv-box.phone { border: 10px solid #121110; border-radius: 34px; }
.pv-box iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #fff; }
.pv-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line-2); font-size: 13px; color: var(--mute); flex-wrap: wrap; }
.pv-toggle { display: none; }

/* ---------- dialogs, menus, toasts ---------- */
dialog.dlg { border: 0; border-radius: 16px; padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 30px 80px rgba(0, 0, 0, .35); color: var(--ink); background: #fff; }
dialog.dlg.wide { width: min(880px, calc(100vw - 32px)); }
dialog.dlg::backdrop { background: rgba(23, 20, 15, .55); }
.dlg-in { padding: 26px 28px 24px; overflow: auto; max-height: calc(100vh - 48px); }
.dlg h2 { margin: 0 0 6px; font-size: 23px; letter-spacing: -0.015em; }
.dlg .lead { margin: 0 0 18px; color: var(--mute); }
.dlg-x { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; font-size: 22px; color: var(--mute); }
.dlg-x:hover { background: var(--bg); color: var(--ink); }
.dlg .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.kinds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kind { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.kind[aria-checked="true"] { border-color: var(--ink); background: #fbf8f1; }
.kind b { display: block; }
.kind small { display: block; color: var(--mute); font-size: 13px; margin-top: 2px; }
.kind code { display: block; margin-top: 6px; font: 500 11.5px/1.3 var(--mono); color: var(--gold); }
.menu { position: fixed; z-index: 50; min-width: 260px; max-width: 360px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 50px rgba(0, 0, 0, .2); padding: 6px; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.menu button:hover, .menu button:focus { background: var(--bg); outline: none; }
.menu button small { display: block; color: var(--mute); font-size: 12.5px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
.menu .cur { font-weight: 600; }
.toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 14px; background: var(--ink); color: #f4efe4; border-radius: 12px; padding: 12px 14px 12px 18px; box-shadow: 0 12px 34px rgba(0, 0, 0, .3); font-size: 15px; max-width: min(560px, calc(100vw - 32px)); animation: tin .25s ease; }
.toast button { background: rgba(255, 255, 255, .12); color: #fff; border: 0; border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 600; }
.toast.is-error { background: var(--red); }
@keyframes tin { from { transform: translateY(10px); opacity: 0; } }

/* ---------- welcome ---------- */
.welcome { max-width: 920px; margin: 0 auto; padding: 46px 32px 80px; }
.welcome h1 { font-size: 40px; line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 10px; font-weight: 620; }
.welcome .lead { font-size: 18px; color: var(--ink-2); max-width: 62ch; margin: 0 0 28px; }
.starts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.start { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 18px; cursor: pointer; box-shadow: var(--shadow); }
.start:hover { border-color: var(--ink); }
.start b { display: block; font-size: 17px; margin-bottom: 4px; }
.start small { display: block; color: var(--mute); font-size: 14px; line-height: 1.45; }
.start.feature { grid-column: span 3; display: flex; align-items: center; gap: 20px; background: var(--ink); color: #f4efe4; border-color: var(--ink); }
.start.feature small { color: #bdb4a5; }
.start.feature .art { flex: none; width: 160px; height: 90px; border-radius: 8px; background-color: #9a4a26; background-blend-mode: multiply; background-size: 220px auto; display: grid; place-items: center; font: 600 14px/1.1 "LR Cinzel", serif; letter-spacing: .08em; color: #ecca7c; text-align: center; border: 1px solid rgba(236, 202, 124, .5); }
.trust { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 26px; color: var(--mute); font-size: 14px; }
.trust span::before { content: "\2713"; color: var(--ok); margin-right: 7px; font-weight: 700; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  :root { --rail: 188px; --pv: 0px; }
  .ed { grid-template-columns: var(--rail) minmax(0, 1fr) 0; }
  .pv { position: fixed; z-index: 40; top: var(--top); right: 0; bottom: 0; width: min(560px, 100vw); box-shadow: -20px 0 50px rgba(0, 0, 0, .2); }
  .ed.pv-closed .pv { display: none; }
  .pv-toggle { display: inline-flex; }
  .boards { grid-template-columns: 220px minmax(0, 1fr); }
}
@media (max-width: 760px) {
  :root { --top: 56px; }
  .ed { grid-template-columns: minmax(0, 1fr); grid-template-rows: var(--top) auto minmax(0, 1fr); }
  .ed-top { padding: 0 10px; gap: 6px; }
  .brand small, .status, .tbtn .tl { display: none; }
  .proj { max-width: 150px; }
  .steps { grid-row: 2; flex-direction: row; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .step { width: auto; flex: none; padding: 8px 10px; }
  .steps hr, .side-note { display: none; }
  .main { grid-row: 3; }
  .view, .welcome { padding: 22px 16px 100px; }
  .row2, .row3, .themes, .outs, .starts, .kinds { grid-template-columns: 1fr; }
  .start.feature { grid-column: auto; flex-direction: column; align-items: flex-start; }
  .boards { grid-template-columns: 1fr; }
  .blist { position: static; }
  .welcome h1 { font-size: 30px; }
}

<noscript><p style="padding:24px;font:18px/1.5 system-ui">The Laurel editor needs JavaScript. Please turn it on, or use a current version of Chrome, Edge, Safari or Firefox.</p></noscript>

<script>
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);

    const req = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    const LSK = (k) => 'laurel:' + k;
    async function init() {
      try {
        db = await new Promise((res, rej) => {
          const r = indexedDB.open('laurel-editor', 1);
          r.onupgradeneeded = () => { r.result.createObjectStore('projects', { keyPath: 'id' }); r.result.createObjectStore('meta'); };
          r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
        });
      } catch (e) {
        mode = 'local';
        try { localStorage.setItem(LSK('probe'), '1'); localStorage.removeItem(LSK('probe')); } catch (e2) { mode = 'memory'; }
      }
    }
    const mem = { projects: {}, meta: {} };
    function localAll() { try { return JSON.parse(localStorage.getItem(LSK('projects')) || '{}'); } catch (e) { return {}; } }
    return {
      init, get mode() { return mode; },
      async list() {
        if (mode === 'idb') return req(db.transaction('projects').objectStore('projects').getAll());
        return Object.values(mode === 'local' ? localAll() : mem.projects);
      },
      async get(id) {
        if (mode === 'idb') return req(db.transaction('projects').objectStore('projects').get(id));
        return (mode === 'local' ? localAll() : mem.projects)[id] || null;
      },
      async put(p) {
        if (mode === 'idb') return req(db.transaction('projects', 'readwrite').objectStore('projects').put(p));
        if (mode === 'local') { const all = localAll(); all[p.id] = p; localStorage.setItem(LSK('projects'), JSON.stringify(all)); return; }
        mem.projects[p.id] = p;
      },
      async del(id) {
        if (mode === 'idb') return req(db.transaction('projects', 'readwrite').objectStore('projects').delete(id));
        if (mode === 'local') { const all = localAll(); delete all[id]; localStorage.setItem(LSK('projects'), JSON.stringify(all)); return; }
        delete mem.projects[id];
      },
      async meta(key) {
        if (mode === 'idb') return req(db.transaction('meta').objectStore('meta').get(key));
        if (mode === 'local') { try { return JSON.parse(localStorage.getItem(LSK('meta:' + key))); } catch (e) { return null; } }
        return mem.meta[key];
      },
      async setMeta(key, val) {
        if (mode === 'idb') return req(db.transaction('meta', 'readwrite').objectStore('meta').put(val, key));
        if (mode === 'local') return localStorage.setItem(LSK('meta:' + key), JSON.stringify(val));
        mem.meta[key] = val;
      },
    };
  })();

  // ---------------------------------------------------------------------------------- licence
  let licence = null;
  async function lsCall(action, params) {
    const r = await fetch(LS_API + action, { method: 'POST', headers: { Accept: 'application/json' }, body: new URLSearchParams(params) });
    let json = null;
    try { json = await r.json(); } catch (e) { /* not JSON */ }
    return { ok: r.ok, status: r.status, json: json || {} };
  }
  function friendly(err) {
    if (/not found/i.test(err)) return 'We couldn’t find that key. Check it against your receipt email (it’s from Lemon Squeezy, on behalf of Singh Studio).';
    if (/activation limit/i.test(err)) return `This key is already in use on as many computers as it allows. Deactivate it on a computer you no longer use, or email ${SHOP.support}.`;
    if (/disabled|expired/i.test(err)) return `This key has been switched off. Email ${SHOP.support} and I’ll sort it out.`;
    return err;
  }
  function instanceName() {
    const ua = navigator.userAgent;
    const what = /Windows/.test(ua) ? 'Windows' : /Mac OS/.test(ua) ? 'Mac' : /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : /Linux/.test(ua) ? 'Linux' : 'computer';
    return `Laurel editor · ${(project && project.org.name) || 'unnamed'} · ${what} · ${today()}`.slice(0, 190);
  }
  async function activate(key) {
    key = key.trim();
    if (!/^[A-Za-z0-9-]{12,80}$/.test(key)) throw new Error('That doesn’t look like a licence key. It’s in your receipt email and looks like 38b1460a-5104-4067-a91d-77b872934d51.');
    if (!SHOP.storeId) throw new Error(`Licences aren’t on sale just yet. Email ${SHOP.support} and I’ll sort you out.`);
    let res;
    try { res = await lsCall('activate', { license_key: key, instance_name: instanceName() }); }
    catch (e) { throw new Error('Couldn’t reach the licence server. Check this computer is online, then try again.'); }
    const j = res.json;
    if (!j.activated) throw new Error(friendly(j.error || 'That key didn’t work.'));
    const meta = j.meta || {};
    const ours = Number(meta.store_id) === Number(SHOP.storeId) && (!SHOP.productIds.length || SHOP.productIds.map(Number).includes(Number(meta.product_id)));
    if (!ours) {
      try { await lsCall('deactivate', { license_key: key, instance_id: j.instance && j.instance.id }); } catch (e) { /* best effort */ }
      throw new Error('That key belongs to a different product.');
    }
    const now = new Date().toISOString();
    licence = {
      key, instanceId: j.instance && j.instance.id,
      tier: /trade|unlimited|agency|studio/i.test(meta.variant_name || '') ? 'trade' : 'club',
      variant: meta.variant_name || '', customer: meta.customer_name || '', activatedAt: now, checkedAt: now, status: 'active',
    };
    await Store.setMeta('licence', licence);
  }
  async function deactivate(force) {
    if (!licence) return;
    if (!force) {
      const r = await lsCall('deactivate', { license_key: licence.key, instance_id: licence.instanceId });
      if (!r.json.deactivated && r.status !== 404) throw new Error(friendly(r.json.error || 'Couldn’t deactivate just now.'));
    }
    licence = null;
    await Store.setMeta('licence', null);
  }
  // Once a week, quietly make sure the key is still good (refunds switch keys off).
  async function recheck() {
    if (!licence || !SHOP.storeId || !navigator.onLine) return;
    if (Date.now() - Date.parse(licence.checkedAt || 0) < 7 * 864e5) return;
    try {
      const r = await lsCall('validate', { license_key: licence.key, instance_id: licence.instanceId });
      if (r.json.valid) licence.status = 'active';
      else if (r.status === 404 || /disabled|expired/.test((r.json.license_key || {}).status || '')) {
        licence.status = 'inactive';
        toast('Your Laurel licence is no longer active, so new files will show the trial ribbon.', { error: true });
      }
      licence.checkedAt = new Date().toISOString();
      await Store.setMeta('licence', licence);
      refreshTop();
    } catch (e) { /* offline: try another day */ }
  }
  const isLicensed = () => !!(licence && licence.status === 'active');

  async function openFile() {

    let text;
    try { text = await readText(file); } catch (e) { return toast('Couldn’t read that file.', { error: true }); }
    let p = null;
    if (/id="laurel-data"/.test(text)) p = X.projectFromHTML(text);
    else if (/^\s*\{/.test(text)) { try { const j = JSON.parse(text); if (j && (j.boards || j.org)) p = M.normaliseProject(j); } catch (e) { p = null; } }

      const at = board() ? project.boards.indexOf(board()) + 1 : project.boards.length;
      project.boards.splice(at, 0, nb);
      ui.board = nb.id;
      d.close(); changed({ focus: nb.id });
      if (ui.step !== 'boards') go('boards'); else renderMain();
      setTimeout(() => { const i = document.querySelector('#grid input[data-r="0"]'); if (i) i.focus(); }, 60);
    };
    title.addEventListener('keydown', (e) => { if (e.key === 'Enter') create(); });
    const d = dialog({ title: 'Add a board', lead: 'Pick the shape that fits. You can rename the columns afterwards.', wide: true, body: h('div', null, kinds, h('div', { class: 'row2', style: 'margin-top:18px' }, field('Title', title), field('Subtitle', sub))),
      actions: [h('button', { class: 'btn ghost', type: 'button', onclick: () => d.close() }, 'Cancel'), h('button', { class: 'btn primary', type: 'button', onclick: create }, 'Add board')] });
  }

  async function importCSV() {
    const file = await pickFile('.csv,.tsv,.txt,text/csv');
    if (!file) return;
    const boards = M.boardsFromCSV(await readText(file));
    if (!boards.length) return toast('That spreadsheet needs a “Board” column and a “Name” column (Year, Subtitle and Detail are optional).', { error: true, ms: 9000 });
    const n = boards.reduce((s, b) => s + b.rows.length, 0);
    if (!(await confirmBox('Add these boards?', `Found ${plural(boards.length, 'board')} with ${plural(n, 'name')}: ${boards.slice(0, 5).map((b) => b.title + (b.subtitle ? ' (' + b.subtitle + ')' : '')).join(', ')}${boards.length > 5 ? '…' : ''}.`, 'Add them'))) return;
    project.boards.push(...boards);
    ui.board = boards[0].id;
    changed(); renderMain();
    toast(`Added ${plural(boards.length, 'board')}.`, { action: { label: 'Undo', fn: undo } });
  }

  // ---------------------------------------------------------------------------------- look
  function viewLook() {
    const L = project.look;
    const b0 = project.boards.find((b) => b.rows.length) || { title: 'Club Champions', rows: [] };
    const ni = M.colIndex(b0, 'name'), yi = M.colIndex(b0, 'year');
    const r0 = b0.rows[b0.rows.length - 1];
    const sample = r0 ? `${yi >= 0 ? r0.c[yi] + '  ' : ''}${ni >= 0 ? r0.c[ni] : ''}` : '1987  A. B. Jones';
    const themes = [['timber', 'Timber & gold', 'Gold leaf on a timber board, like the real thing.'], ['heritage', 'Heritage', 'Ink on paper or stone. Quiet and formal.'], ['modern', 'Modern', 'Big, bold type in your club colours.']];
    const pick = (t) => { L.theme = t; changed(); renderMain(); };
    const tcards = h('div', { class: 'themes', role: 'radiogroup', 'aria-label': 'Style' }, themes.map(([id, name, sub]) => h('button', { type: 'button', role: 'radio', class: 'theme', 'aria-checked': L.theme === id ? 'true' : 'false', onclick: () => pick(id) },
      h('div', { class: 'sw sw-' + id, style: id === 'modern' ? `background:${L.bg};border-left-color:${L.accent}` : null }, h('i', null, (b0.subtitle || 'Honours').toUpperCase()), h('b', null, id === 'heritage' ? b0.title : b0.title.toUpperCase()), h('span', null, sample)),
      h('div', null, h('strong', null, name), h('small', null, sub)))));
    const opts = h('div');
    if (L.theme === 'timber') {
      const woods = [['rimu', 'Rimu', '#a04c27'], ['oak', 'Oak', '#ad7c3e'], ['walnut', 'Walnut', '#6e4a31']];
      opts.append(h('span', { class: 'lbl' }, 'Timber'), h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': 'Timber' }, woods.map(([id, nm, c]) => h('button', { type: 'button', role: 'radio', class: 'swatch', 'aria-checked': L.wood === id ? 'true' : 'false', onclick: () => { L.wood = id; changed(); renderMain(); } }, h('i', { class: 'sw-wood', style: `background-color:${c}` }), nm))));
    } else if (L.theme === 'heritage') {
      const papers = [['ivory', 'Ivory & navy', '#efe5cf'], ['stone', 'Stone & bronze', '#d9d6cf']];
      opts.append(h('span', { class: 'lbl' }, 'Paper'), h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': 'Paper' }, papers.map(([id, nm, c]) => h('button', { type: 'button', role: 'radio', class: 'swatch', 'aria-checked': L.paper === id ? 'true' : 'false', onclick: () => { L.paper = id; changed(); renderMain(); } }, h('i', { class: 'sw-paper', style: `background-color:${c}` }), nm))));
    } else {
      const pairs = [['#0d1b2a', '#e0b43a'], ['#111111', '#ffffff'], ['#0f3d2e', '#e7c84b'], ['#5a0f1e', '#ffffff'], ['#0b2f6b', '#ffffff'], ['#b3121f', '#111111'], ['#14213d', '#fca311'], ['#f4f1ea', '#0b2f6b'], ['#ffffff', '#c8102e']];
      const bg = h('input', { type: 'color', value: L.bg }), ac = h('input', { type: 'color', value: L.accent });
      const contrastNote = h('p', { class: 'hint' });
      const check = () => { const lum = (x) => { const n = parseInt(x.slice(1), 16); const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }; const a = lum(L.bg), b = lum(L.accent); const ratio = (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05); contrastNote.textContent = ratio < 2.2 ? 'Those two colours are close, so the accent will switch to plain white or black to stay readable.' : ''; };
      bg.addEventListener('input', () => { L.bg = bg.value; check(); changed({ typing: true }); });
      ac.addEventListener('input', () => { L.accent = ac.value; check(); changed({ typing: true }); });
      bg.addEventListener('change', () => renderMain()); ac.addEventListener('change', () => renderMain());
      check();
      opts.append(h('span', { class: 'lbl' }, 'Club colours'), h('div', { class: 'pairs', role: 'radiogroup', 'aria-label': 'Colour pairs' }, pairs.map(([x, y]) => h('button', { type: 'button', role: 'radio', class: 'pair', 'aria-checked': L.bg === x && L.accent === y ? 'true' : 'false', 'aria-label': `Background ${x}, accent ${y}`, style: `background:${x}`, onclick: () => { L.bg = x; L.accent = y; changed(); renderMain(); } }, h('span'), h('span', { style: `background:${y}` })))),
        h('div', { class: 'colors' }, h('label', null, bg, 'Background'), h('label', null, ac, 'Accent')), contrastNote);
    }
    return h('div', { class: 'view' },
      head('Step 3', 'Look', 'Pick a style. The preview shows it with your own names.'),
      card(tcards), card(opts),
      card(toggle('Names in capitals', 'Traditional for honours boards. Turn off to show names as typed.', L.caps, (v) => { L.caps = v; changed(); })));
  }

  // ---------------------------------------------------------------------------------- screen
  function viewScreen() {
    const sc = project.screen;
    const out = h('output', { style: 'font-weight:600;min-width:7ch;white-space:nowrap' }, `${sc.seconds} seconds`);
    const range = h('input', { type: 'range', min: 6, max: 30, step: 1, value: sc.seconds, 'aria-label': 'Seconds per page', style: 'width:100%;accent-color:var(--ink)' });
    range.addEventListener('input', () => { sc.seconds = +range.value; out.textContent = `${sc.seconds} seconds`; changed({ typing: true }); });
    const latest = M.latestYear(project);
    const feats = project.boards.reduce((n, b) => n + b.rows.filter((r) => r.photo || r.text).length, 0);
    const lic = isLicensed();
    const trade = lic && licence.tier === 'trade';
    return h('div', { class: 'view' },
      head('Step 4', 'TV screen', 'How the slideshow behaves on your clubhouse TV.', h('button', { class: 'btn', type: 'button', onclick: () => openFull('screen') }, svg(I.eye), 'Try it full size')),
      card(h('span', { class: 'lbl' }, 'Time on each page'), h('div', { style: 'display:flex;gap:16px;align-items:center' }, range, out), h('small', { class: 'hint' }, 'Long lists get a few extra seconds automatically.')),
      card(
        toggle('Cover slide', 'Your crest and name between each loop.', sc.cover, (v) => { sc.cover = v; changed(); }),
        toggle(latest ? `${latest} honours` : 'This year’s honours', latest ? `A slide of everyone honoured in ${latest}, the latest year on your boards.` : 'Appears once your boards have years.', sc.spotlight, (v) => { sc.spotlight = v; changed(); }),
        toggle('Photo and story slides', feats ? `${plural(feats, 'person', 'people')} with a photo or a few words get their own slide.` : 'Add a photo or a few words to a name (the picture button on each row) to give them their own slide.', sc.features, (v) => { sc.features = v; changed(); }),
        toggle('QR code to your website', project.org.url ? 'So members can look themselves up on their phones.' : 'Add your website address in Step 1 first.', sc.qr && !!project.org.url, (v) => { sc.qr = v; changed(); }, !project.org.url),
        toggle('Clock', 'A small clock in the corner.', sc.clock, (v) => { sc.clock = v; changed(); }),
        toggle('Small “Laurel” mark', !lic ? 'Trial files show a “Laurel trial” ribbon instead.' : trade ? 'A tiny credit at the bottom edge. Your Trade licence lets you turn it off.' : 'A tiny credit at the bottom edge. A Trade licence can remove it.', trade ? sc.credit : true, (v) => { sc.credit = v; changed(); }, !trade)),
      card(h('h2', null, 'Boards on the TV'), h('p', null, 'Untick a board to keep it on the website only.'),
        ...project.boards.map((b) => toggle(b.title + (b.subtitle ? ' · ' + b.subtitle : ''), plural(b.rows.filter((r) => r.c.join('') !== '').length, 'name'), b.screen, (v) => { b.screen = v; changed(); }))));
  }

  // ---------------------------------------------------------------------------------- publish
  function exportFile(mode) { return X.boardHTML(project, { assets: A, mode, licence: exportLicence() }); }
  function fileBase() { return X.fileSlug(project) + '-honours'; }
  function openFull(mode) {
    const w = window.open('', '_blank');
    const url = URL.createObjectURL(new Blob([exportFile(mode)], { type: 'text/html;charset=utf-8' }));
    if (w) w.location.href = url + (mode === 'screen' ? '#screen' : ''); else toast('Your browser blocked the new window. Allow pop-ups for this page and try again.', { error: true });
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  function viewPublish() {
    const lic = isLicensed();
    const names = M.countNames(project);
    const size = new Blob([exportFile('browse')]).size;
    const outs = [
      ['screen', I.tv, 'For a TV', 'A slideshow for the clubhouse TV, landscape or portrait. Open it on a laptop or mini PC plugged into the TV and press F.', fileBase() + '-tv.html', 'tv'],
      ['browse', I.web, 'For your website', 'A searchable page members can use from home. Upload it to your website, or ask whoever looks after your site.', fileBase() + '.html', 'website'],
      ['kiosk', I.touch, 'For a touchscreen', 'Plays the slideshow until someone touches it, then lets them search. Returns to the slideshow on its own.', fileBase() + '-touchscreen.html', 'touchscreen'],
    ];
    return h('div', { class: 'view wide' },
      head('Step 5', 'Save & publish', `${plural(project.boards.length, 'board')}, ${plural(names, 'name')}. Download the file for where it’s going.`),
      lic ? h('p', { class: 'note ok' }, `Licensed${licence.customer ? ' to ' + licence.customer : ''}. Your files are ready to use.`)
        : h('p', { class: 'note' }, 'You’re using the free trial. Everything works, and files show a small “Laurel trial” ribbon. A licence is one payment, no subscription, and removes it. ', h('a', { href: SHOP.buyUrl, target: '_blank', rel: 'noopener' }, 'See prices'), ' · ', h('a', { href: '#', onclick: (e) => { e.preventDefault(); licenceDialog(); } }, 'Enter a licence key')),
      h('div', { class: 'outs', style: 'margin-top:16px' }, outs.map(([mode, icon, title, sub, name, anchor]) => h('div', { class: 'out' }, svg(icon), h('h3', null, title), h('p', null, sub),
        h('button', { class: 'btn primary', type: 'button', onclick: () => { download(name, exportFile(mode)); toast(`Downloaded ${name}.`, { action: { label: 'How to set it up', fn: () => window.open(SHOP.guide + '#' + anchor, '_blank', 'noopener') } }); } }, svg(I.down), 'Download'),
        h('button', { class: 'btn ghost sm', type: 'button', onclick: () => openFull(mode) }, 'Open it here first'),
        h('a', { class: 'more', href: SHOP.guide + '#' + anchor, target: '_blank', rel: 'noopener' }, 'Step-by-step setup ↗')))),
      h('p', { class: 'sizes', style: 'margin:10px 2px 0' }, `Each file is about ${kb(size)} and works offline: fonts, pictures and names are all inside it.`),
      card(h('h2', null, 'Keep a backup'), h('p', null, 'Your work saves in this browser, but browsers can be cleared. Keep a backup somewhere safe, like the club’s shared drive. To update next season, open the backup (or any board file) here, add the new names and download again.'),
        h('div', { class: 'btns' },
          h('button', { class: 'btn', type: 'button', onclick: () => download(`${X.fileSlug(project)}-laurel-backup-${today()}.json`, JSON.stringify(project, null, 1), 'application/json') }, svg(I.down), 'Download a backup'),
          h('button', { class: 'btn', type: 'button', onclick: () => download(`${X.fileSlug(project)}-honours.csv`, '\uFEFF' + M.toCSV(project), 'text/csv;charset=utf-8') }, svg(I.down), 'Download as a spreadsheet (CSV)'))),
      lic && licence.tier === 'trade' ? card(toggle('“Made with Laurel” on the website page', 'Your Trade licence lets you turn off the credit at the foot of the website and touchscreen pages.', project.web.credit, (v) => { project.web.credit = v; changed(); })) : null,
      card(h('h2', null, 'Keep a copy of the editor'), h('p', null, 'The editor is a single file too. Save it with your backup and you can keep updating your boards even without the internet, or if this website ever changes.'),
        h('div', { class: 'btns' }, h('button', { class: 'btn', type: 'button', onclick: saveEditor }, svg(I.down), 'Download the editor'))));
  }

  async function saveEditor() {
    try {
      const r = await fetch(location.href.split('#')[0], { cache: 'no-store' });
      if (!r.ok) throw new Error(String(r.status));
      download('laurel-editor.html', await r.text());
      toast('Saved laurel-editor.html. Open it in Chrome, Edge, Safari or Firefox; it works offline.');
    } catch (e) {
      toast(location.protocol === 'file:' ? 'You’re already using a saved copy of the editor. Copy this file to keep another.' : 'Couldn’t download the editor just now. Try again when you’re online.', { error: location.protocol !== 'file:' });
    }
  }

  // ---------------------------------------------------------------------------------- licence dialog
  function licenceDialog() {
    if (isLicensed()) {
      const d = dialog({ title: licence.tier === 'trade' ? 'Trade licence' : 'Club licence', lead: `Active${licence.customer ? ' for ' + licence.customer : ''}${licence.variant ? ' · ' + licence.variant : ''}. Files you download don’t show the trial ribbon.`,
        body: h('p', { class: 'hint' }, 'Moving to a different computer? Deactivate here first so the key is free to use there.'),
        actions: [h('button', { class: 'btn danger', type: 'button', onclick: async () => {
          try { await deactivate(false); } catch (e) {
            if (!(await confirmBox('Couldn’t reach the licence server', e.message + ' Remove the licence from this browser anyway?', 'Remove it', true))) return;
            await deactivate(true);
          }
          d.close(); refreshTop(); renderMain(); preview(); toast('Licence removed from this computer.');
        } }, 'Deactivate on this computer'), h('button', { class: 'btn primary', type: 'button', onclick: () => d.close() }, 'Done')] });
      return;
    }
    const inp = h('input', { class: 'in big', placeholder: 'xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx', autocomplete: 'off', spellcheck: 'false', 'aria-label': 'Licence key' });
    const msg = h('p', { class: 'hint', role: 'alert' });
    const go_ = h('button', { class: 'btn primary', type: 'button', onclick: async () => {
      go_.disabled = true; go_.textContent = 'Checking…'; msg.textContent = '';
      try {
        await activate(inp.value);
        d.close(); refreshTop(); renderMain(); preview();
        toast('Thank you! Your licence is active. Download your files again to drop the trial ribbon.', { ms: 7000 });
      } catch (e) { msg.textContent = e.message; msg.style.color = 'var(--red)'; go_.disabled = false; go_.textContent = 'Activate'; }
    } }, 'Activate');
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') go_.click(); });
    const d = dialog({ title: 'Free trial', lead: 'Everything works in the trial; downloaded files show a small “Laurel trial” ribbon. Buy a licence once and it’s gone for good.',
      body: h('div', null, h('p', { class: 'btns', style: 'margin:0 0 18px' }, h('a', { class: 'btn gold', href: SHOP.buyUrl, target: '_blank', rel: 'noopener' }, 'See prices and buy')),
        h('label', { class: 'f' }, h('span', null, 'Already bought? Enter your licence key'), inp, h('small', null, 'It’s in the receipt email. The editor checks it once online; after that it works offline.')), msg),
      actions: [h('button', { class: 'btn ghost', type: 'button', onclick: () => d.close() }, 'Not now'), go_] });
    setTimeout(() => inp.focus(), 30);
  }

  // ---------------------------------------------------------------------------------- preview
  const PV = { frame: null, ready: false, qrUrl: null, qr: '', box: null, stage: null };
  const PVM = {
    tv: { w: 1920, h: 1080, mode: 'screen', cls: 'tv', label: 'TV' },
    portrait: { w: 1080, h: 1920, mode: 'screen', cls: 'tv', label: 'Portrait TV' },
    web: { w: 1280, h: 860, mode: 'browse', cls: '', label: 'Website' },
    phone: { w: 390, h: 800, mode: 'browse', cls: 'phone', label: 'Phone' },
    kiosk: { w: 1920, h: 1080, mode: 'kiosk', cls: 'tv', label: 'Touchscreen' },
  };
  function qr() {
    const u = project.org.url;
    if (u !== PV.qrUrl) { PV.qrUrl = u; PV.qr = u ? X.qrSvg(u) : ''; }
    return PV.qr;
  }
  function buildPreview() {
    if (!project) { pvEl.replaceChildren(); PV.frame = null; return; }
    PV.ready = false;
    const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Preview as' }, Object.keys(PVM).map((k) => h('button', { type: 'button', 'aria-pressed': ui.pv === k ? 'true' : 'false', onclick: () => { ui.pv = k; seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', 'false')); seg.children[Object.keys(PVM).indexOf(k)].setAttribute('aria-pressed', 'true'); fit(); send(); } }, PVM[k].label)));
    PV.frame = h('iframe', { title: 'Live preview of your board', sandbox: 'allow-scripts allow-popups', tabindex: '-1' });
    PV.frame.srcdoc = X.boardHTML(project, { assets: A, mode: PVM[ui.pv].mode, preview: true, licence: exportLicence() });
    PV.box = h('div', { class: 'pv-box' }, PV.frame);
    PV.stage = h('div', { class: 'pv-stage' }, PV.box);
    pvEl.replaceChildren(h('div', { class: 'pv-bar' }, seg, h('span', { class: 'spacer' }), h('button', { class: 'btn ghost sm pv-toggle', type: 'button', onclick: togglePreview }, 'Close')), PV.stage,
      h('div', { class: 'pv-foot' }, h('span', null, 'Live preview. Keys ← → step through the TV slides.'), h('button', { class: 'btn sm', type: 'button', onclick: () => openFull(PVM[ui.pv].mode) }, 'Open full size ↗')));
    fit();
    if (window.ResizeObserver) { if (PV.ro) PV.ro.disconnect(); PV.ro = new ResizeObserver(() => fit()); PV.ro.observe(PV.stage); }
  }
  function fit() {
    if (!PV.frame || !PV.stage) return;
    const m = PVM[ui.pv];
    const pad = m.cls ? 20 : 0;
    const W = PV.stage.clientWidth - 36, H = PV.stage.clientHeight - 36;
    if (W <= 0 || H <= 0) return;
    const k = Math.min((W - pad) / m.w, (H - pad) / m.h, 1);
    PV.box.className = 'pv-box ' + m.cls;
    PV.box.style.width = Math.round(m.w * k + pad) + 'px';
    PV.box.style.height = Math.round(m.h * k + pad) + 'px';
    PV.frame.style.width = m.w + 'px';
    PV.frame.style.height = m.h + 'px';
    PV.frame.style.transform = `scale(${k})`;
  }
  function send(focus) {
    if (!PV.ready || !PV.frame || !project) return;
    PV.frame.contentWindow.postMessage({ laurel: 'project', project: JSON.parse(snapshot()), qr: qr(), licence: exportLicence(), mode: PVM[ui.pv].mode, focus: focus || null }, '*');
  }
  const previewSoon = debounce((focus) => send(focus), 220);
  function preview() { send(); }
  function togglePreview() { ui.pvOpen = !ui.pvOpen; refreshTop(); setTimeout(fit, 30); }
  window.addEventListener('message', (e) => {
    if (!PV.frame || e.source !== PV.frame.contentWindow || !e.data) return;
    if (e.data.laurel === 'ready') { PV.ready = true; send(ui.step === 'boards' ? ui.board : null); }
  });

  // ---------------------------------------------------------------------------------- keys & boot
  document.addEventListener('keydown', (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (!mod || !project) return;
    const k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); redo(); }
    else if (k === 's') { e.preventDefault(); save(); toast('Saved in this browser. Download a backup to keep a copy elsewhere.', { action: { label: 'Back up now', fn: () => go('publish') } }); }
  });
  window.addEventListener('beforeunload', () => { if (saveTimer) save(); });

  async function boot() {
    shell();
    try { await Store.init(); } catch (e) { /* memory mode */ }
    try { licence = (await Store.meta('licence')) || null; } catch (e) { licence = null; }
    let cur = null;
    try {
      const id = await Store.meta('current');
      if (id) cur = await Store.get(id);
      if (!cur) { const all = await Store.list(); all.sort((a, b) => String(b.updated).localeCompare(String(a.updated))); cur = all[0] || null; }
    } catch (e) { cur = null; }
    if (cur) {
      project = M.normaliseProject(cur);
      ui.board = project.boards[0] ? project.boards[0].id : null;
      let step = null;
      try { step = await Store.meta('step'); } catch (e) { step = null; }
      ui.step = STEPS.some((s) => s[0] === step) ? step : 'club';
    }
    resetHist();
    render();
    buildPreview();
    // Links from the Laurel pages: #example opens the sample club, #template=golf starts that template.
    const hash = location.hash.replace(/^#/, '');
    const tpl = (hash.match(/^template=([a-z]+)$/) || [])[1];
    if (hash === 'example' || (tpl && S.TEMPLATES[tpl])) {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* file:// */ }
      if (hash === 'example') open(S.golfClub(), 'boards');
      else if (!project) startFrom(tpl);
      else toast(`Start a new ${S.TEMPLATES[tpl].label.toLowerCase()} board?`, { action: { label: 'Start', fn: () => startFrom(tpl) }, ms: 9000 });
    }
    if (Store.mode === 'memory') toast('This browser won’t let Laurel save your work. Keep the tab open and download a backup before you close it.', { error: true, ms: 12000 });
    recheck();
  }
  // a couple of hooks for the automated tests
  window.__laurel = { get project() { return project; }, get licence() { return licence; }, exportFile, go, open };
  boot();
})();

</script>
