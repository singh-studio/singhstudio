<!doctype html><html lang="en-NZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duly calculator</title><meta name="robots" content="noindex"><link rel="stylesheet" href="/assets/duly.css"></head><body class="embed"><form class="calc" id="calc" data-calc data-regime="oia" data-embed="true" novalidate>
<div class="calc-form">
<label>Counting under<select name="regime"><optgroup label="Official information"><option value="oia" selected>OIA request (Official Information Act)</option><option value="lgoima">LGOIMA request (councils)</option><option value="privacy">Privacy Act request for personal information</option></optgroup><optgroup label="Property and tenancy"><option value="rta">Tenancy notice (Residential Tenancies Act)</option><option value="sale-purchase">Property sale and purchase agreement</option><option value="sale-purchase-lim">Property sale and purchase: LIM date</option><option value="pla">Property Law Act notices (mortgages, leases)</option><option value="lta">Land Transfer Act (caveats)</option><option value="ppsa">Personal Property Securities Act</option></optgroup><optgroup label="Planning and building"><option value="rma">Resource consent (RMA)</option><option value="building">Building consent (Building Act)</option></optgroup><optgroup label="Construction"><option value="cca">Payment claim (Construction Contracts Act)</option></optgroup><optgroup label="Courts"><option value="hcr">High Court Rules</option><option value="senior-courts">Senior Courts Act (appeals and leave)</option><option value="dcr">District Court Rules</option><option value="district-court-act">District Court Act (statutory periods)</option></optgroup><optgroup label="Companies, tax and contracts"><option value="companies">Companies Act (statutory demands, meetings)</option><option value="ird-due-date">Tax due date (IRD)</option><option value="tax-acts">Tax Acts (working-day periods)</option><option value="era">Personal grievance or trial period (Employment Relations Act)</option></optgroup><optgroup label="General"><option value="legislation-act">Any other Act (Legislation Act default)</option><option value="business-day">Business days (banks in Auckland and Wellington)</option></optgroup></select></label>
<p class="rule-line" data-rule-line>Skips weekends, public holidays and 25 December – 15 January.</p>
<div class="presets" data-presets aria-label="Common timeframes"></div>
<div class="calc-row">
<label><span data-from-label>Start date</span><input type="date" name="from" required></label>
<label><span data-days-label>Working days</span><input type="number" name="days" min="0" max="2000" step="1" inputmode="numeric" value="20" required></label>
</div>
<div class="calc-row three">
<div role="group" aria-label="Direction" class="dir" data-dir-wrap><button type="button" data-dir="after" aria-pressed="true">After</button><button type="button" data-dir="before" aria-pressed="false">Before</button></div>
<label data-province-wrap hidden>Province (anniversary day)<select name="province"><option value="">Choose a province…</option><option value="wellington">Wellington (Wellington, Wairarapa, Manawatū, Whanganui)</option><option value="auckland">Auckland (Auckland, Northland, Waikato, Coromandel, Bay of Plenty, Gisborne)</option><option value="nelson">Nelson (Nelson, Tasman, Buller)</option><option value="taranaki">Taranaki (Taranaki)</option><option value="otago">Otago (Otago, Dunedin, Queenstown, Central Otago)</option><option value="southland">Southland (Southland, Invercargill, Gore, Fiordland)</option><option value="south-canterbury">South Canterbury (Timaru, Mackenzie, Waimate)</option><option value="hawkes-bay">Hawke&#39;s Bay (Napier, Hastings, Central Hawke&#39;s Bay)</option><option value="marlborough">Marlborough (Marlborough, Blenheim, Picton)</option><option value="canterbury">Canterbury (Christchurch, North and Central Canterbury, Ashburton)</option><option value="chatham-islands">Chatham Islands (Chatham Islands)</option><option value="westland">Westland (Westland, Greymouth, Hokitika)</option></select></label>
</div>
<label data-service-wrap hidden>How the notice was given<select name="service"></select></label>
<details class="adv"><summary>More options</summary><div class="stack">
<label>Count in<select name="unit"><option value="working">Working days</option><option value="calendar">Calendar days</option></select></label>
<label data-roll-wrap hidden>If the answer isn’t a working day<select name="roll"><option value="none">Leave it</option><option value="next">Move to the next working day</option><option value="previous">Move to the previous working day</option></select></label>
<label class="check"><input type="checkbox" name="on"> Count the start date itself as day 1</label>
</div></details>
<noscript><p class="note">The calculator needs JavaScript. The <a href="/developers/">API</a> works without it.</p></noscript>
</div>
<div class="result" data-result aria-live="polite"></div>
<p class="credit">Counted by <a href="https://duly.nz/" target="_blank" rel="noopener">Duly</a> · <a href="https://duly.nz/oia/" target="_blank" rel="noopener">How OIA counts working days</a></p>
</form><script type="module" src="/assets/app.js"></script></body></html>
